name: Compile PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: BuildLetter
        uses: xu-cheng/latex-action@v2
        with:
          root_file: LetterTemplate.tex
      - name: SaveLetter
        uses: actions/upload-artifacts@v4
        with:
          name: letter
          path: LetterTemplate.pdf
      - name: BuildReport
        uses: xu-cheng/latex-action@v2
        with:
          root_file: ReportTemplate.tex
      - name: SaveReport
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: ReportTemplate.pdf
